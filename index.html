<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zlylv.AI - Kelajak Intellekt Platformasi</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-main: #070913;
            --bg-sidebar: #0e1322;
            --bg-card: #151b2b;
            --bg-card-hover: #1c2438;
            --accent-glow: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
            --accent-solid: #6366f1;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --sidebar-width: 280px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Stil */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 24px 18px;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 20px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 30px;
            padding: 0 8px;
            letter-spacing: -0.5px;
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            background: var(--accent-glow);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 16px;
            border-radius: 14px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            text-align: left;
        }

        .nav-btn i {
            font-size: 18px;
            width: 24px;
            text-align: center;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            transform: translateX(4px);
        }

        .nav-btn.active {
            background: var(--accent-glow);
            color: #fff;
            box-shadow: 0 8px 20px rgba(168, 85, 247, 0.3);
        }

        /* Limit paneli */
        .limits-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            margin-top: 15px;
        }

        .limit-item {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }

        .limit-item:last-child {
            margin-bottom: 0;
        }

        .limit-item span {
            color: #fff;
            font-weight: 700;
        }

        /* Pro Karta */
        .pro-card {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1) 0%, rgba(236, 72, 153, 0.1) 100%);
            border: 1px solid rgba(168, 85, 247, 0.25);
            border-radius: 16px;
            padding: 18px;
            text-align: center;
            margin-top: 15px;
        }

        .pro-card h4 {
            font-size: 15px;
            margin-bottom: 6px;
            font-weight: 700;
        }

        .pro-card p {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 14px;
        }
